<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>DICE WiFi — Fast. Reliable. Unlimited.</title>
    <!--
      SPA fallback for static hosts (GitHub Pages serves this file for any
      unknown path). Instead of dropping the visitor at the site root, we stash
      the URL they actually asked for and let index.html restore it before the
      router mounts — so a reload or shared deep link keeps working.

      On a project page (user.github.io/repo/) the first path segment is the
      base and must be preserved; on a custom domain there is no such segment.
    -->
    <script>
      (function () {
        var segmentsToKeep = location.hostname.endsWith('github.io') ? 1 : 0;
        var parts = location.pathname.split('/').filter(Boolean);
        var base = '/' + parts.slice(0, segmentsToKeep).join('/');
        if (!base.endsWith('/')) base += '/';

        try {
          sessionStorage.setItem('dice-spa-redirect', location.href);
        } catch (e) {
          /* private mode — fall back to landing on the home page */
        }
        location.replace(base);
      })();
    </script>
  </head>
  <body></body>
</html>
