<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DICE WiFi — Fast. Reliable. Unlimited.</title>
    <!-- SPA fallback: GitHub Pages serves this file for unknown routes.
         Redirect to the app root so client-side routing can take over. -->
    <script>
      (function () {
        var segments = location.pathname.split('/').filter(Boolean);
        if (segments[0] === 'dice-wifi') segments.shift();
        location.replace('/dice-wifi/' + segments.join('/'));
      })();
    </script>
  </head>
  <body></body>
</html>
