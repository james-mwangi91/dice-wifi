<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1E0B3A" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <title>DICE Hotspot — WiFi from KES 10</title>
    <meta name="description" content="DICE Hotspot: fast, affordable pay-as-you-go WiFi across Nairobi. Bundles from KES 10, pay with M-Pesa, connect in seconds." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="DICE Hotspot — WiFi from KES 10" />
    <meta property="og:description" content="Unlimited pay-as-you-go WiFi across Nairobi. Pay with M-Pesa, connect in seconds." />
    <meta property="og:image" content="https://images.unsplash.com/photo-1607748862156-7c548e7e98f4?auto=format&fit=crop&crop=faces&w=1200&h=630&q=80" />
    <meta property="og:locale" content="en_KE" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Outfit:wght@500..900&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <!-- Apply the saved (or system) theme before first paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('dice-hotspot-theme');
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
